<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 12px 14px; color: #18191c; font-size: 13px; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .sec { margin: 10px 0 4px; padding-top: 8px; border-top: 1px solid #eee; font-weight: 600; font-size: 12px; color: #61666d; }
  label { display: flex; align-items: center; gap: 6px; margin: 5px 0; cursor: pointer; }
  .row { margin: 7px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lbl { width: 62px; flex-shrink: 0; }
  input[type="range"] { flex: 1; min-width: 90px; }
  .num { width: 48px; padding: 2px 4px; border: 1px solid #ccd0d7; border-radius: 4px; font-size: 12px; text-align: center; }
  .num-sec { display: none; }
  .urow { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .urow label { margin: 0; }
  .phrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  button { padding: 3px 10px; border: 1px solid #ccd0d7; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; }
  button:hover { background: #f6f7f8; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .thumb { position: relative; width: 56px; height: 40px; border-radius: 4px; overflow: hidden; border: 1px solid #e3e5e8; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-x { position: absolute; top: 0; right: 0; width: 16px; height: 16px; line-height: 15px; text-align: center; font-size: 12px; color: #fff; background: rgba(0,0,0,0.6); cursor: pointer; border-radius: 0 0 0 4px; }
  .st { margin-top: 4px; font-size: 12px; color: #9499a0; }
  .range-hint { margin: 4px 0 8px; font-size: 11px; color: #9499a0; line-height: 1.5; }
  .hint { margin-top: 10px; color: #9499a0; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
  <h3>B站视频时长分类与过滤</h3>

  <div class="sec">过滤开关</div>
  <label><input type="checkbox" id="cb-short"> 过滤短视频(遮挡)</label>
  <label><input type="checkbox" id="cb-mid"> 过滤中视频(遮挡)</label>
  <label><input type="checkbox" id="cb-live"> 过滤直播(遮挡)</label>

  <div class="sec">分类区间(长 &gt; 中 &gt; 短;中视频下限=短视频上限)</div>
  <div class="row"><span class="lbl">短视频上限</span><input type="range" id="range-short" min="30" max="300" step="30"><span class="val"><input type="number" id="in-short-min" class="num" min="0"> <span class="unit-min">min</span><input type="number" id="in-short-sec" class="num num-sec" min="0" max="59"> <span class="unit-sec" style="display:none;">s</span></span></div>
  <div class="row"><span class="lbl">中视频上限</span><input type="range" id="range-mid" min="360" max="1800" step="30"><span class="val"><input type="number" id="in-mid-min" class="num" min="0"> <span class="unit-min">min</span><input type="number" id="in-mid-sec" class="num num-sec" min="0" max="59"> <span class="unit-sec" style="display:none;">s</span></span></div>
  <div class="range-hint" id="range-hint"></div>
  <div class="urow">单位:
    <label><input type="radio" name="unit" id="unit-min" checked> min</label>
    <label><input type="radio" name="unit" id="unit-s"> s</label>
  </div>

  <div class="sec">显示选项</div>
  <label><input type="checkbox" id="cb-badge"> 显示分类标签(短/中/长)</label>
  <label><input type="checkbox" id="cb-ph"> 过滤时显示占位图(不勾则直接隐藏)</label>
  <label><input type="checkbox" id="cb-title"> 占位卡显示视频名称</label>
  <label><input type="checkbox" id="cb-unhide"> 单击占位卡解除该视频隐藏</label>
  <label><input type="checkbox" id="cb-pet"> 显示右下角桌宠挂件</label>

  <div class="sec">短视频遮挡照片(轮流显示)</div>
  <div class="phrow"><button id="btn-pick-short">添加照片(可多选)</button><button id="btn-clear-short">清空</button></div>
  <div class="thumbs" id="thumbs-short"></div>
  <div class="st" id="st-short"></div>

  <div class="sec">中视频遮挡照片(轮流显示)</div>
  <div class="phrow"><button id="btn-pick-mid">添加照片(可多选)</button><button id="btn-clear-mid">清空</button></div>
  <div class="thumbs" id="thumbs-mid"></div>
  <div class="st" id="st-mid"></div>

  <div class="sec">直播遮挡照片(轮流显示)</div>
  <div class="phrow"><button id="btn-pick-live">添加照片(可多选)</button><button id="btn-clear-live">清空</button></div>
  <div class="thumbs" id="thumbs-live"></div>
  <div class="st" id="st-live"></div>

  <input type="file" id="file-short" accept="image/*" multiple style="display:none;">
  <input type="file" id="file-mid" accept="image/*" multiple style="display:none;">
  <input type="file" id="file-live" accept="image/*" multiple style="display:none;">

  <div class="hint">照片组为空时用扩展内置默认图。自定义照片存在本机浏览器;想在其他电脑用同样照片,可把照片重命名为 placeholder.jpg 替换扩展文件夹里的文件。解除隐藏的卡片刷新页面后会重新隐藏。</div>
  <script src="popup.js"></script>
</body>
</html>
